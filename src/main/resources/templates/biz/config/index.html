<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head th:replace="/common/template :: header(~{::title},~{::link},~{::style})">
    <style>
        .dict-value {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body class="timo-layout-page">
<div class="layui-card">
    <div class="layui-card-header timo-card-header">
        <span><i class="fa fa-bars"></i> 系统配置</span>
        <i class="layui-icon layui-icon-refresh refresh-btn"></i>
    </div>
    <div class="layui-card-body">
        <div class="layui-row timo-card-screen">
            <div class="pull-left layui-form-pane timo-search-box">
                <div class="layui-inline">
                    <label class="layui-form-label">配置项key</label>
                    <div class="layui-input-block">
                        <input type="text" name="name" th:value="${param.title}" placeholder="请输入配置项key"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <button class="layui-btn layui-btn-normal timo-search-btn">
                        <i class="fa fa-search"></i>
                    </button>
                </div>
                <button class="layui-btn open-popup" data-title="添加配置" th:attr="data-url=@{/global/config/add}"
                        shiro:hasPermission="system:dict:add" data-size="615,558">
                    <i class="fa fa-plus"></i> 添加
                </button>
            </div>
        </div>
        <div class="timo-table-wrap">
            <table class="layui-table timo-table">
                <thead>
                <tr>
                    <th class="sortable" data-field="id">配置项id</th>
                    <th class="sortable" data-field="name">配置项key</th>
                    <th class="sortable" data-field="value">配置项value</th>
                    <th class="sortable" data-field="description">配置描述</th>
                    <th class="sortable" data-field="serviceType">服务类型</th>
                    <th class="sortable" data-field="orgId">组织结构</th>
                    <th class="sortable" data-field="createTime">修改时间</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item:${list}">
                    <td th:text="${item.id}">配置项id</td>
                    <td th:text="${item.name}">配置项key</td>
                    <td th:text="${item.value}">配置项value</td>
                    <td th:text="${item.description}">配置描述</td>
                    <td th:text="${item.serviceType}">服务类型</td>
                    <td th:text="${item.orgId}">组织结构</td>
                    <td th:text="${#dates.format(item.createTime, 'yyyy-MM-dd HH:mm:ss')}">修改时间</td>
                    <td>
                        <a class="open-popup" data-title="编辑字典" th:attr="data-url=@{'/global/config/edit/'+${item.name}}"
                           shiro:hasPermission="global:config:edit"
                           data-size="615,558" href="#">编辑</a>
                        <a class="ajax-get" data-msg="您是否确认删除" th:href="@{/global/config/remove(name=${item.name})}"
                           shiro:hasPermission="global:config:remove">删除</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:replace="/common/fragment :: page"></div>
    </div>
</div>
<script th:replace="/common/template :: script"></script>
<script>
    layui.use(['element'], function () {
        var $ = layui.jquery;
        var dv = $(".dict-value");
        $(window).on("resize", function () {
            var width = $("body").width();
            if (width > 1200) {
                dv.css("max-width", width * 0.32);
            } else {
                dv.css("max-width", width * 0.20);
            }
        }).resize();
    });
</script>
</body>
</html>
