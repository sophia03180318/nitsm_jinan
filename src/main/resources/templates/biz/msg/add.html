<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:mo="https://gitee.com/hanwone">
<head th:replace="/common/template :: header(~{::title},~{::link},~{::style})">
    <link rel="stylesheet" th:href="@{/static/lib/zTree_v3/css/zTreeStyle/zTreeStyle.css}" type="text/css">
</head>
<body>
<div class="layui-form timo-compile">
    <form th:action="@{/system/msg/save}">
        <input type="hidden" name="id" th:if="${msg}" th:value="${msg.id}"/>
        <div class="layui-form-item">
            <label class="layui-form-label required">模板名称</label>
            <div class="layui-input-inline">
                <input class="layui-input" type="text" name="name" placeholder="请输入模板名称" th:value="${msg?.name}">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label required">模板标题</label>
            <div class="layui-input-inline">
                <input class="layui-input" type="text" name="title" placeholder="请输入模板标题" th:value="${msg?.title}">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label required">模板类别</label>
            <div class="layui-input-inline">
                <input class="layui-input" type="text" name="category" placeholder="请输入模板类别"
                       th:value="${msg?.category}">
            </div>
        </div>
        <div class="layui-form-item layui-form-text">
            <label class="layui-form-label required">模板内容</label>
            <div class="layui-input-block">
                <textarea placeholder="请输入模板内容" class="layui-textarea" name="content">[[${msg?.content}]]</textarea>
            </div>
        </div>
        <div class="layui-form-item layui-form-text">
            <label class="layui-form-label">备注</label>
            <div class="layui-input-block">
                <textarea placeholder="请输入备注内容" class="layui-textarea" name="remark">[[${msg?.remark}]]</textarea>
            </div>
        </div>
        <div class="layui-form-item timo-finally">
            <button class="layui-btn ajax-submit"><i class="fa fa-check-circle"></i> 保存</button>
            <button class="layui-btn btn-secondary close-popup"><i class="fa fa-times-circle"></i> 关闭</button>
        </div>
    </form>
</div>
<script th:replace="/common/template :: script"></script>

</body>
</html>
