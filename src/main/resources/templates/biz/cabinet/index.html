<!DOCTYPE>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head th:replace="/common/template :: header(~{::title},~{::link},~{::style})">
    <link rel="stylesheet" th:href="@{/lib/zTree_v3/css/zTreeStyle/zTreeStyle.css}" type="text/css">
</head>
<body class="timo-layout-page">
<div class="layui-card">
    <div class="layui-card-header timo-card-header">
        <span><i class="fa fa-bars"></i> 机柜管理</span>
        <i class="layui-icon layui-icon-refresh refresh-btn"></i>
    </div>
    <div class="layui-card-body layui-row">
        <div class="layui-col-lg2 layui-col-sm3">
            <div id="tabTopo" class="layui-card-body">
                <div class="layui-tab layui-tab-card">
                    <ul class="layui-tab-title">
                        <li class="layui-this">组织机构</li>
                    </ul>
                    <div class="layui-tab-content">
                        <div class="layui-tab-item layui-show">
                            <ul class="ztree" th:attr="data-url=@{'/system/cabinet/list?'+${search}}" id="orgMM"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-col-lg10 layui-col-sm9">
            <div class="layui-row timo-card-screen">
                <div class="pull-left layui-form-pane timo-search-box">
                    <div class="layui-inline">
                        <label class="layui-form-label">机柜名称 </label>
                        <div class="layui-input-block">
                            <input type="text" name="name" th:value="${param.name}" placeholder="请输入机柜名称"
                                   autocomplete="off"
                                   class="layui-input">
                        </div>
                    </div>
                    <div class="layui-inline">
                        <button class="layui-btn layui-btn-normal timo-search-btn">
                            <i class="fa fa-search"></i>
                        </button>
                    </div>
                    <div class="layui-inline">
                        <input type="text" style="display:none" id="orgTreeId" name="orgTreeId"
                               th:value="${param.orgTreeId}" placeholder="组织ID"
                               autocomplete="off"
                               class="layui-input"></div>
                </div>
                <div class="pull-right screen-btn-group">
                    <div class="btn-group-right">
                        <button class="layui-btn open-popup" data-title="添加机柜" th:attr="data-url=@{/system/cabinet/add}"
                                shiro:hasPermission="system:cabinet:add" data-size="600,580">
                            <i class="fa fa-plus"></i> 添加
                        </button>
                    </div>
                </div>
            </div>
            <div th:fragment="article_type" id="article_type" class="timo-table-wrap">
                <table id="cabinet_ul" class="layui-table timo-table timo-table-fixed">
                    <thead>
                    <tr>
                        <th data-field="name" style="width:8%">机柜名称</th>
                        <th data-field="qrCodeNum" style="width:8%">识别号</th>
                        <th data-field="code" style="width:15%">组织结构</th>
                        <th data-field="roomId" style="width:8%">所属机房</th>
                        <th data-field="rowIndex" style="width:6%">列</th>
                        <th data-field="columnIndex" style="width:6%">行</th>
                        <th data-field="modifyTime" style="width:10%">更新时间</th>
                        <th data-field="creator" style="width:5%">创建人</th>
                        <th style="width:8%">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item:${list}">
                        <td th:text="${item.name}">机柜名称</td>
                        <td th:text="${item.qrCodeNum}">识别号</td>
                        <td th:text="${item.orgName}">组织结构</td>
                        <td th:text="${item.roomId}">所属机房</td>
                        <td th:text="${item.rowIndex}">横向索引</td>
                        <td th:text="${item.columnIndex}">纵向索引</td>
                        <td th:text="${#dates.format(item.modifyTime, 'yyyy-MM-dd HH:mm:ss')}">更新时间</td>
                        <td th:text="${item.creator}">创建人</td>
                        <td>
                            <a class="open-popup" data-title="编辑机柜"
                               th:attr="data-url=@{'/system/cabinet/edit/'+${item.id}}"
                               shiro:hasPermission="system:cabinet:edit"
                               data-size="600,580" href="#">编辑</a>
                            <a class="ajax-get" data-cabinet="您是否确认删除"
                               th:href="@{/system/cabinet/del/(ids=${item.id})}"
                               shiro:hasPermission="system:cabinet:del">删除</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:replace="/common/fragment :: page"></div>
        </div>
    </div>
</div>
<script th:replace="/common/template :: script"></script>
<script type="text/javascript" th:src="@{/js/plugins/jquery-3.3.1.min.js}"></script>
<script type="text/javascript" th:src="@{/lib/zTree_v3/js/jquery.ztree.core.min.js}"></script>
<script type="text/javascript" th:src="@{/js/timoTree.js}"></script>

<script>
    var setting = {
        data: {
            simpleData: {
                enable: true
            }
        },
        check: {
            enable: true,
            chkboxType: {"Y": "", "N": ""}
        },
        callback: {
            onClick: function (event, treeId, treeNode) {
                var orgId = treeNode.id;
                getCanbinet(orgId);
                var treeObj = $.fn.zTree.getZTreeObj("orgMM");//ztree树的ID

            }
        }
    };
    $.get($("#orgMM").data("url"), function (result) {
        var zNodes = [];
        result.data.forEach(function (item) {

            var org = {
                id: item.id,
                pId: item.pid,
                name: item.title
            };
            if (item.pid === "0" || item.pid === "1") {
                org.open = true;
                org.checked = true;
            }
            zNodes.push(org);
        });
        $.fn.zTree.init($("#orgMM"), setting, zNodes);
        var treeObj = $.fn.zTree.getZTreeObj("orgMM");//ztree树的ID

        //获取input中的值orgTreeId
        var orgTreeId = document.getElementById('orgTreeId').value;
        var node = treeObj.getNodeByParam("id", orgTreeId);//根据ID找到该节点
        treeObj.selectNode(node);//根据该节点选中
    });


    function getCanbinet(orgId) {
        var getSearch = "";
        // 搜索框参数

        if (orgId !== "" && orgId !== undefined) {
            getSearch += "orgTreeId" + "=" + orgId + "&";
        }
        ;

        // 页数参数
        var pageSize = $(".page-number").val();
        if (pageSize !== undefined && pageSize !== "") {
            getSearch += "size=" + pageSize + "&";
        }

        // 排序参数
        var asc = $(".sortable.asc").data("field");
        if (asc !== undefined) {
            getSearch += "orderByColumn=" + asc + "&isAsc=asc&";
        }
        var desc = $(".sortable.desc").data("field");
        if (desc !== undefined) {
            getSearch += "orderByColumn=" + desc + "&isAsc=desc&";
        }

        if (getSearch !== "") {
            getSearch = "?" + getSearch.substr(0, getSearch.length - 1);
        }
        window.location.href = window.location.pathname + getSearch;

    }


</script>
</body>
</html>
