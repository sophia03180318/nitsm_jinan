<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:mo="https://gitee.com/hanwone"
      xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head th:replace="/common/template :: header(~{::title},~{::link},~{::style})">
</head>
<body class="timo-layout-page">
<div class="layui-card">
    <div class="layui-card-header timo-card-header">
        <span><i class="fa fa-bars"></i> 日志管理</span>
        <i class="layui-icon layui-icon-refresh refresh-btn"></i>
    </div>
    <div class="layui-card-body">
        <div class="layui-row timo-card-screen">
            <div class="pull-left layui-form-pane timo-search-box">
                <div class="layui-inline">
                    <label class="layui-form-label">类型</label>
                    <div class="layui-input-block timo-search-status">
                        <select class="timo-search-select" name="logType" mo:dict="LOG_TYPE"
                                mo-selected="${param.logType}"
                                mo-empty="全部"></select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">模块名称 </label>
                    <div class="layui-input-block">
                        <input type="text" name="logModel" th:value="${param.logModel}" placeholder="请输入模块名称"
                               autocomplete="off"
                               class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">用户名 </label>
                    <div class="layui-input-block">
                        <input type="text" name="creator" th:value="${param.creator}" placeholder="请输入操作用户名"
                               autocomplete="off"
                               class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <button class="layui-btn layui-btn-normal timo-search-btn">
                        <i class="fa fa-search"></i>
                    </button>
                </div>
            </div>
            <div class="pull-right screen-btn-group">
                <a class="layui-btn layui-btn-danger ajax-get" data-msg="此操作会删除数据，您是否确认转存数据"
                   th:href="@{/biz/data/transfer}"
                   shiro:hasPermission="biz:data:transfer">
                    <i class="layui-icon layui-icon-list"></i> 转存数据</a>

                <a class="layui-btn ajax-get" data-msg="您是否确认清空日志" th:href="@{/system/actionLog/status/delete}"
                   shiro:hasPermission="system:actionLog:status">
                    <i class="fa fa-trash"></i> 清空日志</a>
            </div>
        </div>
        <div class="timo-table-wrap">
            <table class="layui-table timo-table timo-table-fixed">
                <thead>
                <tr>
                    <!--<th class="timo-table-checkbox">
                        <label class="timo-checkbox"><input type="checkbox">
                            <i class="layui-icon layui-icon-ok"></i></label>
                    </th>-->
                    <th class="sortable" data-field="logModel">模块名称</th>
                    <th class="sortable" data-field="logName">操作动作</th>
                    <th class="sortable" data-field="creator">操作人</th>
                    <th class="sortable" data-field="logType">日志类型</th>
                    <th class="sortable" data-field="operUserIp">IP地址</th>
                    <th class="sortable" data-field="logMsg">操作结果</th>
                    <th class="sortable" data-field="createTime">记录时间</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item:${list}">
                    <!--<td><label class="timo-checkbox"><input type="checkbox" th:value="${item.id}">
                        <i class="layui-icon layui-icon-ok"></i></label></td>-->
                    <td th:text="${item.logModel}">模块名称</td>
                    <td th:text="${item.logName}">操作动作</td>
                    <td th:text="${item.creator}">操作人</td>
                    <td th:text="${#dicts.keyValue('LOG_TYPE', item.logType)}">日志类型</td>
                    <td th:text="${item.operUserIp}">IP地址</td>
                    <td th:text="${item.logMsg}">操作结果</td>
                    <td th:text="${#dates.format(item.createTime, 'yyyy-MM-dd HH:mm:ss')}">创建时间</td>
                    <td>
                        <a class="open-popup" data-title="详细信息"
                           th:attr="data-url=@{'/system/actionLog/detail/'+${item.id}}"
                           shiro:hasPermission="system:actionLog:detail" data-size="800,600"
                           href="#">详细</a>
                        <a class="ajax-get" data-msg="您是否确认删除"
                           th:href="@{/system/actionLog/status/delete(id=${item.id})}"
                           shiro:hasPermission="system:actionLog:status">删除</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:replace="/common/fragment :: page"></div>
    </div>
</div>
<script th:replace="/common/template :: script"></script>
</body>
</html>
