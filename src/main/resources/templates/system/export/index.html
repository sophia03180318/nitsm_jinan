<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      xmlns:mo="https://gitee.com/hanwone"
      xmlns:shiro="https://www.pollix.at/thymeleaf/shiro">
<head th:replace="/common/template :: header(~{::title},~{::link},~{::style})">
</head>
<body class="timo-layout-page">
<div class="layui-card">
    <div class="layui-card-header timo-card-header">
        <span><i class="fa fa-bars"></i> 资源导出模板</span>
    </div>
          <div class="layui-card-body">
        <div class="layui-row timo-card-screen put-row">
            <div class="pull-left layui-form-pane timo-search-box">
                <div class="layui-inline">
                    <label class="layui-form-label">模板名</label>
                    <div class="layui-input-block">
                        <input type="text" name="templateName" th:value="${param.templateName}" placeholder="请输入模板名"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
<!--                <div class="layui-inline">
                    <label class="layui-form-label">模板类型</label>
                     <div class="layui-input-block timo-search-status">
                        <select class="timo-search-select" name="type" mo:dict="TEMPLATE_TYPE"
                                mo-selected="${param.type}"
                                mo-empty="全部"></select>
                    </div>
                </div>-->
                <div class="layui-inline">
                    <button class="layui-btn layui-btn-normal timo-search-btn">
                        <i class="fa fa-search"></i>
                    </button>
                </div>
                <div class="layui-inline">
                    <button class="layui-btn open-popup" data-title="添加模板" shiro:hasPermission="system:export:add" th:attr="data-url=@{/system/export/add}" data-size="600,570">
                        <i class="fa fa-plus"></i> 添加模板
                    </button>
                </div>
            </div>
        </div>

        <div class="timo-table-wrap">
            <table class="layui-table timo-table">
                <thead>
                <tr>
                    <th class="sortable" data-field="templateName">模板名称</th>
                  <!--  <th class="sortable" data-field="type">模板类型</th>-->
                    <th class="sortable" data-field="remark">备注</th>
                    <th class="sortable" data-field="createTime">创建时间</th>
                    <th class="sortable" data-field="modifyTime">修改时间</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
               <tr th:each="item:${list}">

                    <td th:text="${item.templateName}">模板名称</td>
                   <!-- <td th:text="${#dicts.keyValue('TEMPLATE_TYPE', item.type)}">模板类型</td>-->
                    <td th:text="${item.remark}">备注</td>
                    <td th:text="${#dates.format(item.createTime, 'yyyy-MM-dd HH:mm:ss')}">创建时间</td>
                   <td th:text="${#dates.format(item.modifyTime, 'yyyy-MM-dd HH:mm:ss')}">修改时间</td>
                    <td>
                        <a class="open-popup" data-title="编辑模板" th:attr="data-url=@{'/system/export/edit/'+${item.id}}"
                           shiro:hasPermission="system:export:edit"
                           data-size="500,470" href="#">编辑</a>

                        <a class="open-popup" data-title="详细信息" th:attr="data-url=@{'/system/export/detail/'+${item.id}}"
                           shiro:hasPermission="system:export:detail"
                           data-size="800,600" href="#">详细</a>

                        <a class="ajax-get" th:attr="data-msg='您是否删除'+${item.templateName}"
                           shiro:hasPermission="system:export:deleteById"
                           th:href="@{/system/export/deleteById(id=${item.id})}"
                        >删除</a>

                        <a th:href="@{'/system/export/exportTemplate/'+${item.id}}"
                           shiro:hasPermission="system:export:exportTemplate"
                           style="color:rgb(86,80,27)"
                        ><i class="fa fa-download"></i>导出</a>

                    </td>
                </tr>
                </tbody>
            </table>
        </div>
      <div th:replace="/common/fragment :: page"></div>
    </div>

</div>
<script th:replace="/common/template :: script"></script>
</body>
</html>
