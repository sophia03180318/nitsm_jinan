<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:mo="https://gitee.com/hanwone">
<head th:replace="/common/template :: header(~{::title},~{::link},~{::style})">
    <link rel="stylesheet" th:href="@{/lib/zTree_v3/css/zTreeStyle/zTreeStyle.css}" type="text/css">
    <script src="/lib/layui-v2.3.0/layui.all.js" charset="utf-8"></script>
</head>
<body>

<div class="layui-form timo-compile">
    <form th:action="@{/system/collector/saveTime}">
        <input type="hidden" name="id" th:if="${minute}" th:value="${minute.id}"/>

        <div class="layui-form-item">
            <font style="margin-left: 80px" class="layui-form-label">执行间隔:</font>
            <div class="layui-input-inline">
                <input style="width:30px;" class="layui-input" type="text" name="minute" placeholder="请输入需改时间(分钟数)"
                       th:value="${minute?.minute}">
            </div>
        </div>

        <div class="layui-form-item timo-finally">
            <button style="margin-left: 70px" class="layui-btn layui-btn-danger ajax-submit"><i class="fa fa-check-circle"></i> 保存
            </button>
            <button class="layui-btn btn-secondary close-popup"><i class="fa fa-times-circle"></i> 关闭</button>
        </div>
    </form>
</div>

<script th:replace="/common/template :: script"></script>
</body>

</html>
