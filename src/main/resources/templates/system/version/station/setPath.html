<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:mo="https://gitee.com/hanwone">
<head th:replace="/common/template :: header(~{::title},~{::link},~{::style})">
    <link rel="stylesheet" th:href="@{/lib/zTree_v3/css/zTreeStyle/zTreeStyle.css}" type="text/css">
</head>
<body>
<div class="layui-form timo-compile">
    <form id="jarUploadForm" th:action="@{/system/version/station/beginSetPath}">
        <div class="layui-form-item">
            <label class="layui-form-label required">存储路径</label>
            <div class="layui-input-inline">
                <input class="layui-input" type="text" name="savePath" placeholder="请输入项目jar所在同级目录" >
            </div>
        </div>
        <input type="hidden" name="setPathStationId" th:value="${setPathStationId}" >

        <div class="layui-form-item timo-finally">
            <button class="layui-btn ajax-submit"><i class="fa fa-check-circle"></i> 提交</button>
            <button class="layui-btn btn-secondary close-popup"><i class="fa fa-times-circle"></i> 关闭</button>
        </div>
    </form>
</div>
<script th:replace="/common/template :: script"></script>

<script>
window.onload=function(){

}


</script>

</body>
</html>
