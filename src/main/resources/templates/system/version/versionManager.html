<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      xmlns:shiro="https://www.pollix.at/thymeleaf/shiro">
<head th:replace="/common/template :: header(~{::title},~{::link},~{::style})"></head>

<body class="timo-layout-page">
<div class="layui-card">
	<div class="layui-card-header timo-card-header">
		<span><i class="fa fa-bars"></i> 车站软件管理</span>
		<i class="layui-icon layui-icon-refresh refresh-btn"></i>
	</div>
	
	<div class="layui-card-body">
		<div class="layui-row timo-card-screen put-row">
			<div class="pull-left layui-form-pane timo-search-box">
				<div class="layui-inline">
					<label class="layui-form-label">版本号</label>
					<div class="layui-input-block">
                        <input type="text" name="version" th:value="${param.version}" placeholder="请输入版本号" autocomplete="off" class="layui-input">
                    </div>
				</div>
				<div class="layui-inline">
                    <label class="layui-form-label">上传时间</label>
                    <div class="layui-input-block">
                         <input id="time1" name="createDateStr" th:value="${param.createDateStr}" placeholder="请选择时间" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <button class="layui-btn layui-btn-normal timo-search-btn">
                        <i class="fa fa-search"></i>查询
                    </button>
                </div>
                
                <div class="layui-inline">
                    <button class="layui-btn open-popup" data-title="版本上传" th:attr="data-url=@{/system/version/manager/uploadPage}"
                            shiro:hasPermission="system:version:manager:uploadPage" data-size="500,500">
                        <i class="fa fa-plus"></i> 上传
                    </button>
                </div>
			</div>
		</div>
		
		<div class="timo-table-wrap">
			<table class="layui-table timo-table">
				<thead>
					<tr>
						<th class="sortable" data-field="version">版本号</th>
						<th class="sortable" data-field="descStr">描述信息</th>
						<th class="sortable" data-field="remark">备注信息</th>
						<th class="sortable" data-field="createDate">上传时间</th>
						<th>操作</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="item:${list}">
						<td th:text="${item.version}">版本号</td>
						<td th:text="${item.descStr}">描述信息</td>
						<td th:text="${item.remark}">备注信息</td>
						<td th:text="${#dates.format(item.createDate, 'yyyy-MM-dd HH:mm:ss')}">上传时间</td>
						
						<td>
							<a class="open-popup" data-title="详细信息" th:attr="data-url=@{'/system/version/manager/detail/'+${item.id}}"
                           shiro:hasPermission="system:version:manager:detail"
                           data-size="500,500" href="#">详细</a>
                           
							<a class="ajax-get" th:attr="data-msg='您是否要删除车站'+${item.version}+'版本'"
                           th:href="@{/system/version/manager/remove(ids=${item.id})}"
                           shiro:hasPermission="system:version:manager:remove">删除</a>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
		<div th:replace="/common/fragment :: page"></div>
	</div>
</div>

<script th:replace="/common/template :: script"></script>

<script>
layui.use('laydate', function(){
	var laydate = layui.laydate;
	
	//执行一个laydate实例
	laydate.render({
		elem: '#time1' //指定元素
	});
});
</script>

</body>
</html>
