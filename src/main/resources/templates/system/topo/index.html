<!DOCTYPE>
<html xmlns:th="https://www.thymeleaf.org">
<head th:replace="/common/template :: header(~{::title},~{::link},~{::style})">
    <link rel="stylesheet" th:href="@{/lib/zTree_v3/css/zTreeStyle/zTreeStyle.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/grapheditor.css}" type="text/css">
    <style>
        .status-container {
            text-align: center;
            position: absolute;
            overflow: hidden;
            bottom: 0px;
            max-height: 24px;
            height: 36px;
            color: white;
            padding: 6px;
        }

        .timo-tree {
            width: 500px;
            left: 0px;
            position: absolute;
            overflow: auto;
            height: 95%;
        }
        .geTabContainer {
            position: absolute;
            white-space: nowrap;
            overflow: hidden;
            height: 38px;
            left: 500px;
            bottom: 39px;
            right: 50px;
            border-top: 1px solid #e5e5e5;
            background-color: #f1f3f4;
        }
        .timo-tree {
            width: 350px;
            left: 0px;
            position: absolute;
            overflow: auto;
            height: 95%;
        }
        img.mxToolbarMode{
            width:90%;
        }
        .type img{
            height:125px;
            max-width:100%;
            margin:5px 0;
        }
        .type-name{
            height:35px;
            line-height:35px;
            font-size:16px;
            border-bottom:1px solid #eaeaea;
        }
        .type-item-img{
            padding-left:20px;
        }
        .type-item-number img{
            height:13px;
        }
        .layui-table td, .layui-table th {
            position: relative;
            padding: 5px 5px;
            min-height: 20px;
            line-height: 10px;
            font-size: 11px;
        }
    </style>
</head>
<body class="geEditor">
<div style="padding-left:500px;position:relative;height:98%;width:auto">
    <div class="layui-card timo-tree">
        <div class="layui-card-header">
<!--            全局的拓扑发现暂时不用-->
<!--            <button type="button" id="topoDiscoverButton" onclick="topoDiscover()" class="layui-btn">拓扑发现</button>-->
        </div>
        <div id="tabTopo" class="layui-card-body">
            <div class="layui-tab layui-tab-card">
                <ul class="layui-tab-title">
                    <li class="layui-this">组织机构</li>
                    <li id="wancheng" style="display:none">连线信息</li>
                    <li id="room" style="">机房平面图</li>
                </ul>
                <div class="layui-tab-content">
                    <div class="layui-tab-item layui-show">
                        <ul class="ztree" th:attr="data-url=@{'/system/org/list?'+${search}}" id="orgTree"></ul>
                    </div>
                    <div  style="display:none" class="layui-tab-item">
                        <table id="wancheng2" style="display:none" class="layui-table">
                            <tbody id="topo_link_content">
                            <tr><td>无连接信息</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div   class="layui-tab-item">


                        <ul id="room2">
                            <li class="type" style="cursor:pointer;"  data-height="1">
                                <div class="type-name">机房平面图</div>
                                <div class="type-item-img">
                                    <img  src="../../graph/images/room.jpg">
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="topo_ul" class="layui-tab layui-tab-brief">
        <ul  class="layui-tab-title">
            <li class="layui-this" id="cabinet_topo" onclick="changeBody(2);">机柜拓扑</li>
            <li  id="net_topo" onclick="changeBody(1);">网络拓扑</li>
            <li id="pc_topo" onclick="changeBody(3);">调度台</li>
<!--            <li id="biz_topo">业务拓扑</li>-->
        </ul>
        <div class="layui-tab layui-tab-brief" style="position:absolute;left:500px;top:35px;z-index:999;background:#fefefe;border:1px solid #eaeaea;">
            <ul class="layui-tab-title" id="roomContainer">
            </ul>
        </div>


        <div class="layui-tab-content">
            <div class="layui-tab-item layui-show">
                <!-- 绘图区 -->
                <div id="topoContainer" class="topo-container"></div>
                <!--- 创建页签 -->
                <div id="containetTab" ></div>
                <!-- 创建底部状态栏 -->
                <div id="statusContainer" class="status-container"></div>
            </div>
        </div>
    </div>
</div>
<script language="javascript" type="text/javascript">
    function changeBody(index){
        switch(index){
            case 1:{//网络拓扑
                $('#tabTopo .layui-tab-title li').eq(0).addClass('layui-this').siblings().removeClass('layui-this');
                $('#tabTopo .layui-tab-item ').eq(0).addClass('layui-show').siblings().removeClass('layui-show');
                document.getElementById('wancheng').style.display = "";
                document.getElementById('wancheng2').style.display = "";
                document.getElementById('room').style.display = "none";
                document.getElementById('room2').style.display = "none";
                break;
            }
            case 3:{//调度台
                $('#tabTopo .layui-tab-title li').eq(0).addClass('layui-this').siblings().removeClass('layui-this');
                $('#tabTopo .layui-tab-item ').eq(0).addClass('layui-show').siblings().removeClass('layui-show');
                document.getElementById('wancheng').style.display = "none";
                document.getElementById('wancheng2').style.display = "none";
                document.getElementById('room').style.display = "none";
                document.getElementById('room2').style.display = "none";
                break;
            }
            case 2:{//机柜拓扑
                $('#tabTopo .layui-tab-title li').eq(0).addClass('layui-this').siblings().removeClass('layui-this');
                $('#tabTopo .layui-tab-item ').eq(0).addClass('layui-show').siblings().removeClass('layui-show');
                document.getElementById('wancheng').style.display = "none";
                document.getElementById('wancheng2').style.display = "none";
                document.getElementById('room').style.display = "";
                document.getElementById('room2').style.display = "";
                break;
            }
        }
    }
</script>
<script th:replace="/common/template :: script"></script>
<script type="text/javascript"> mxBasePath = '/graph/'; </script>
<script type="text/javascript" th:src="@{/js/plugins/jquery-3.3.1.min.js}"></script>
<script type="text/javascript" th:src="@{/graph/js/mxClient.js}"></script>
<script type="text/javascript" th:src="@{/js/myGraph/myGraphEditorUI.js}"></script>
<script type="text/javascript" th:src="@{/js/myGraph/myGraphEditor.js}"></script>
<script type="text/javascript" th:src="@{/js/myGraph/Graph.js}"></script>
<script type="text/javascript" th:src="@{/js/myGraph/Shapes.js}"></script>
<script type="text/javascript" th:src="@{/js/myGraph/Actions.js}"></script>
<script type="text/javascript" th:src="@{/js/myGraph/Pages.js}"></script>
<script type="text/javascript" th:src="@{/js/myGraph/pako.min.js}"></script>

<script type="text/javascript" th:src="@{/lib/zTree_v3/js/jquery.ztree.core.min.js}"></script>
<script type="text/javascript" th:src="@{/js/timoTree.js}"></script>
<script type="text/javascript" th:src="@{/js/main/index.js}"></script>
</body>
</html>
